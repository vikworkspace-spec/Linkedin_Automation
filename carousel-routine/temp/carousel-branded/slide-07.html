<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Instrument+Serif:ital@1&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;background:#0D0D0D;color:#fff;display:flex;align-items:center;justify-content:center}
.slide{width:1080px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px;text-align:center;background:linear-gradient(135deg,#0D0D0D 0%,#1a1a2e 50%,#E63946 150%)}
.tag{font-size:14px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.6);margin-bottom:30px}
.cta{font-size:52px;font-weight:900;line-height:1.2;letter-spacing:-1px;max-width:800px}
.brand{font-size:22px;color:rgba(255,255,255,0.6);margin-top:50px}
.brand strong{color:#E63946}
</style>
</head>
<body>
<div class="slide">
<div class="tag">The Future of Hiring</div>
<div class="cta">Follow for more on how staffing is changing</div>
<div class="brand">@<strong>zetabotai</strong> &middot; Daily staffing insights</div>
</div>
</body>
</html>
