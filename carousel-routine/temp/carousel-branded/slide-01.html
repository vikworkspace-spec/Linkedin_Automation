<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Instrument+Serif:ital@1&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;background:#0D0D0D;color:#fff;display:flex;align-items:center;justify-content:center}
.slide{width:1080px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px;text-align:center;background:linear-gradient(135deg,#0D0D0D 0%,#1a1a2e 50%,#16213e 100%)}
.tag{font-size:14px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#E63946;margin-bottom:40px}
.hook{font-size:72px;font-weight:900;line-height:1.1;letter-spacing:-2px;max-width:850px}
.hook span{color:#E63946;font-style:italic;font-family:'Instrument Serif',Georgia,serif}
.sub{font-size:22px;color:#aaa;margin-top:30px;font-weight:500}
</style>
</head>
<body>
<div class="slide">
<div class="tag">The Hiring Shift</div>
<div class="hook">AI writes a better <span>resume</span> than your best candidate</div>
<div class="sub">Swipe to see what staffing firms are doing about it</div>
</div>
</body>
</html>
